# Settings for the RFP Response Agent. Change values here; no code changes needed.

[agent]
enabled = true            # kill switch: set to false (or create a file called STOP) and the agent refuses to run
max_llm_calls = 400       # hard cap on AI calls per run
max_retries_per_answer = 2
max_words_per_answer = 160
today = ""                # leave empty to use today's date; set e.g. "2026-11-16" for repeatable tests

[ollama]
url = "http://localhost:11434"
model = "qwen2.5:7b"      # any instruct model you have pulled with `ollama pull`
num_ctx = 8192
timeout_seconds = 300

[retrieval]
top_k = 3
won_boost = 1.15          # answers from bids we won rank a little higher
recency_loss_per_year = 0.15

[web]
mode = "snapshot"         # "snapshot" = saved pages in data/web_snapshot.json;  "searxng" = live search;  "off"
searxng_url = "http://localhost:8888"
max_pages_per_entity = 6
# Words the agent may add to a company name when it searches. Nothing from the RFP text is ever sent.
competitor_topics = ["product", "pricing", "reviews", "outage", "data residency"]
customer_topics = ["strategy", "annual report", "press release", "conference", "priorities"]

[approval]
roles = ["technical", "account"]   # both must sign, and they must be different people

[server]
host = "127.0.0.1"        # this computer only
port = 8765
